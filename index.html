<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Registration Form Validation</title>

        <!-- Tailwind CSS -->
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

        <link rel="stylesheet" href="style.css">
    </head>

    <body class="bg-gray-100 flex justify-center items-center min-h-screen">

        <div class="bg-white p-8 rounded-lg shadow-lg w-96">

            <h2 class="text-2xl font-bold text-center mb-6">
                Registration Form
            </h2>

            <form id="registerForm">

                <!-- Name -->
                <div class="mb-4">
                    <label class="font-semibold">Name</label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your name"
                        class="w-full mt-2 p-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500">

                    <p id="nameError" class="text-red-500 text-sm mt-1"></p>
                </div>

                <!-- Email -->
                <div class="mb-4">
                    <label class="font-semibold">Email</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        class="w-full mt-2 p-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500">

                    <p id="emailError" class="text-red-500 text-sm mt-1"></p>
                </div>

                <!-- Password -->
                <div class="mb-4">
                    <label class="font-semibold">Password</label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter password"
                        class="w-full mt-2 p-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500">

                    <p id="passwordError" class="text-red-500 text-sm mt-1"></p>
                </div>

                <button
                    id="submitBtn"
                    disabled
                    class="w-full bg-blue-600 text-white py-2 rounded disabled:bg-gray-400">
                    Register
                </button>

            </form>

        </div>

        <script src="script.js"></script>

    </body>
</html>
